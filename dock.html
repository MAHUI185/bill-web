<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>码头看板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b1220; color: #e2e8f0; font-family: -apple-system, "Microsoft YaHei", sans-serif; min-height: 100vh; padding: 20px 28px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 28px; letter-spacing: 2px; }
  .clock { font-size: 26px; color: #38bdf8; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 12px; font-size: 14px; color: #94a3b8; }
  .stats b { color: #fbbf24; font-size: 20px; margin: 0 4px; }
  h2 { font-size: 18px; margin: 22px 0 12px; color: #94a3b8; letter-spacing: 1px; }
  .docks { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .dock { background: #111c2e; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; min-height: 120px; }
  .dock.busy { border-color: #f97316; background: #1f1307; }
  .dock .name { font-size: 20px; font-weight: bold; color: #f97316; margin-bottom: 10px; }
  .dock .code { font-size: 26px; font-weight: bold; color: #fbbf24; letter-spacing: 1px; }
  .dock .meta { font-size: 14px; color: #cbd5e1; margin-top: 6px; line-height: 1.6; }
  .dock .meta span { color: #94a3b8; }
  .waiting { background: #111c2e; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; }
  .waiting table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .waiting th, .waiting td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #1e293b; }
  .waiting th { color: #94a3b8; font-weight: normal; font-size: 14px; }
  .waiting td.pos { color: #38bdf8; font-weight: bold; font-size: 20px; width: 70px; }
  .waiting td.code { color: #fbbf24; font-weight: bold; }
  .empty { color: #475569; text-align: center; padding: 24px; font-size: 16px; }
  .free { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { background: #052e16; border: 1px solid #166534; color: #4ade80; padding: 10px 16px; border-radius: 999px; font-size: 16px; }
  .chip span { color: #64748b; font-size: 12px; margin-left: 4px; }
  .err { color: #f87171; margin-top: 16px; font-size: 14px; }
  .updated { position: fixed; right: 20px; bottom: 14px; font-size: 12px; color: #475569; }
</style>
<script src="./supabase-js.js"></script>
</head>
<body>
<header>
  <div>
    <h1>🏭 收货码头看板</h1>
    <div class="updated" id="updated"></div>
  </div>
  <div class="stats">卸货中<b id="calling-count">0</b>车 · 空闲<b id="free-count">0</b>个 · 排队<b id="waiting-count">0</b>车</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<h2>卸货中</h2>
<div class="docks" id="docks"></div>

<h2>空闲码头</h2>
<div class="free" id="free-docks"></div>

<h2>等待叫号</h2>
<div class="waiting">
  <table>
    <thead><tr><th>序号</th><th>预约码</th><th>厂商</th><th>货量</th><th>时段</th><th>签到时间</th></tr></thead>
    <tbody id="waiting-body"></tbody>
  </table>
</div>

<div class="err" id="err"></div>

<script>
(function () {
  if (!window.supabase || !window.supabase.createClient) {
    document.getElementById('err').innerText = '排队组件加载失败，请检查网络后刷新页面';
    return;
  }
  const SUPABASE_URL = 'https://gpjdzgakvqhnpykuqbfr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_vUAhYoF1D51WyWlPnLzSlA_JDBODtaW';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function minutesSince(t) {
    if (!t) return '';
    const m = Math.max(0, Math.floor((Date.now() - new Date(t).getTime()) / 60000));
    return m < 60 ? m + ' 分钟' : Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
  }

  function tickClock() {
    document.getElementById('clock').innerText = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  }
  tickClock();
  setInterval(tickClock, 1000);

  async function refresh() {
    let data, error;
    try {
      const res = await sb.rpc('get_dock_board');
      data = res.data; error = res.error;
    } catch (e) {
      document.getElementById('err').innerText = '网络异常，重试中...';
      return;
    }
    if (error) {
      document.getElementById('err').innerText = '加载失败：' + error.message;
      return;
    }
    document.getElementById('err').innerText = '';
    document.getElementById('updated').innerText = '更新于 ' + new Date().toLocaleTimeString();

    const rows = data || [];
    const calling = rows.filter(r => r.status === 'calling');
    const free = rows.filter(r => r.status === 'free');
    const waiting = rows.filter(r => r.status === 'waiting');

    document.getElementById('calling-count').innerText = calling.length;
    document.getElementById('free-count').innerText = free.length;
    document.getElementById('waiting-count').innerText = waiting.length;

    document.getElementById('free-docks').innerHTML = free.map(r => `
      <span class="chip">${esc(r.dock_name)}${r.temp_layer ? ' · ' + esc(r.temp_layer) : ''}
        <span>${esc(r.warehouse_code || '')}</span></span>`).join('')
      || '<div class="empty">暂无空闲码头</div>';

    // 卸货中：按码头分组
    const byDock = new Map();
    calling.forEach(r => {
      const d = r.dock_name || r.assigned_dock || '未分配码头';
      if (!byDock.has(d)) byDock.set(d, []);
      byDock.get(d).push(r);
    });

    const dockNames = Array.from(byDock.keys()).sort((a, b) => a.localeCompare(b, 'zh-CN'));
    document.getElementById('docks').innerHTML = dockNames.map(d => `
      <div class="dock busy">
        <div class="name">${esc(d)}</div>
        ${byDock.get(d).map(r => `
          <div class="code">${esc(r.appointment_code || '-')}</div>
          <div class="meta">
            <span>厂商：</span>${esc(r.vendor_name || '-')}<br>
            <span>货量：</span>${Number(r.boxes || 0)} 箱<br>
            <span>叫号：</span>${r.call_time ? minutesSince(r.call_time) + '前' : '刚刚'}
          </div>`).join('')}
      </div>`).join('') || '<div class="empty" style="grid-column:1/-1;">暂无卸货车辆</div>';

    document.getElementById('waiting-body').innerHTML = waiting.map((r, i) => `
      <tr>
        <td class="pos">${i + 1}</td>
        <td class="code">${esc(r.appointment_code || '-')}</td>
        <td>${esc(r.vendor_name || '-')}</td>
        <td>${Number(r.boxes || 0)} 箱</td>
        <td>${esc(r.slot || '-')}</td>
        <td>${r.check_in_time ? new Date(r.check_in_time).toLocaleTimeString() + '（等 ' + minutesSince(r.check_in_time) + '）' : '-'}</td>
      </tr>`).join('') || '<tr><td colspan="6" class="empty">暂无排队车辆</td></tr>';
  }

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>

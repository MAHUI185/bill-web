<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>收货工作台</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #f1f5f9; color: #0f172a; font-family: -apple-system, "Microsoft YaHei", sans-serif; padding-bottom: 70px; }
  header { position: sticky; top: 0; z-index: 10; background: #0f172a; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  header .clock { font-size: 18px; color: #38bdf8; font-variant-numeric: tabular-nums; }
  header a { color: #fca5a5; font-size: 12px; text-decoration: none; margin-left: 10px; }
  section { padding: 12px 16px 0; }
  h2 { font-size: 15px; color: #475569; margin: 8px 0 10px; }
  h2 span { color: #1677ff; }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); border-left: 4px solid #cbd5e1; }
  .card.calling { border-left-color: #f97316; }
  .card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .code { font-size: 20px; font-weight: bold; color: #1677ff; letter-spacing: 1px; }
  .card .dock { background: #ffedd5; color: #c2410c; font-size: 13px; font-weight: bold; padding: 3px 10px; border-radius: 999px; }
  .card .pos { background: #e0f2fe; color: #0369a1; font-size: 13px; font-weight: bold; padding: 3px 10px; border-radius: 999px; }
  .card .meta { font-size: 13px; color: #64748b; margin: 8px 0 12px; line-height: 1.6; }
  .card .btn { width: 100%; border: none; border-radius: 10px; padding: 14px; font-size: 17px; font-weight: bold; color: #fff; }
  .btn.green { background: #16a34a; }
  .btn.blue { background: #1677ff; }
  .btn:active { opacity: .8; }
  .empty { color: #94a3b8; text-align: center; padding: 18px; font-size: 14px; background: #fff; border-radius: 12px; }
  .msg { margin: 10px 16px 0; color: #b91c1c; font-size: 13px; }
  .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e2e8f0; padding: 10px 16px; display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; }
  .footer a { color: #1677ff; text-decoration: none; }
  .login-card { margin: 24px 16px; background: #fff; border-radius: 14px; padding: 22px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .login-card h2 { font-size: 20px; color: #0f172a; margin: 0 0 6px; }
  .login-card p { font-size: 13px; color: #64748b; margin: 0 0 18px; line-height: 1.6; }
  .login-card input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 17px; margin-bottom: 12px; }
  .login-card button { width: 100%; padding: 15px; border: none; border-radius: 10px; background: #1677ff; color: #fff; font-size: 18px; font-weight: bold; }
  .login-msg { color: #b91c1c; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; display: flex; align-items: flex-end; }
  .sheet { background: #fff; width: 100%; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 80vh; overflow: auto; }
  .sheet h3 { margin: 0 0 12px; font-size: 17px; }
  .sheet .opt { width: 100%; text-align: left; padding: 14px; border-radius: 10px; border: 1px solid #cbd5e1; background: #f8fafc; margin-bottom: 8px; font-size: 16px; }
  .sheet .opt:disabled { color: #94a3b8; background: #f1f5f9; }
  .sheet .opt.primary { border-color: #1677ff; background: #eff6ff; color: #1677ff; font-weight: bold; }
  .sheet .cancel { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #e2e8f0; color: #475569; font-size: 16px; margin-top: 6px; }
  .sheet input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; margin-bottom: 8px; }
  .sheet select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; margin-bottom: 8px; background: #fff; }
  .sheet label.opt { display: flex; align-items: center; gap: 10px; }
  .sheet label.opt input[type="checkbox"] { width: 22px; height: 22px; margin: 0; }
</style>
<script src="./supabase-js.js"></script>
</head>
<body>
<header>
  <div>
    <h1>🚚 收货工作台</h1>
    <div class="sub"><span id="who">未登录</span><a id="logout" href="javascript:void(0)" style="display:none;">退出登录</a></div>
  </div>
  <div class="clock" id="clock">--:--</div>
</header>

<div id="msg" class="msg"></div>

<div id="login-box" class="login-card">
  <h2>收货员登录</h2>
  <p>输入姓名和手机号登录（由管理员在「基础数据 → 码头管理」里维护收货员）。登录后可叫车、完成收货；选择码头后可合并多个预约码一起收货。</p>
  <input id="lg-name" placeholder="姓名" autocomplete="name" />
  <input id="lg-phone" placeholder="手机号" type="tel" autocomplete="tel" inputmode="numeric" />
  <button id="lg-btn">登录</button>
  <div class="login-msg" id="lg-msg"></div>
</div>

<div id="workbench" style="display:none;">
  <section style="padding-top:12px;">
    <button class="btn blue" id="btn-merge" style="width:100%;">合并收货（多个预约码）</button>
  </section>
  <section>
    <h2>卸货中 <span id="calling-count">0</span></h2>
    <div id="calling-list" class="cards"></div>
  </section>
  <section>
    <h2>等待叫车 <span id="waiting-count">0</span></h2>
    <div id="waiting-list" class="cards"></div>
  </section>
</div>

<div class="footer">
  <span id="updated">--</span>
  <a href="javascript:location.reload()">刷新页面</a>
</div>

<div id="modal-root"></div>

<script>
(function () {
  const SUPABASE_URL = 'https://gpjdzgakvqhnpykuqbfr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_vUAhYoF1D51WyWlPnLzSlA_JDBODtaW';
  const TOKEN_KEY = 'dock_receiver_token_v1';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  if (!window.supabase || !window.supabase.createClient) {
    $('msg').innerText = '页面组件加载失败，请检查网络后刷新';
    return;
  }
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let token = localStorage.getItem(TOKEN_KEY) || '';
  let me = null;
  let rows = [];
  let timer = null;

  const tick = () => { $('clock').innerText = new Date().toLocaleTimeString('zh-CN', { hour12: false }).slice(0, 5); };
  tick();
  setInterval(tick, 10000);

  function showLogin() {
    if (timer) { clearInterval(timer); timer = null; }
    $('login-box').style.display = 'block';
    $('workbench').style.display = 'none';
    $('logout').style.display = 'none';
    $('who').innerText = '未登录';
  }

  function showWorkbench() {
    $('login-box').style.display = 'none';
    $('workbench').style.display = 'block';
    $('logout').style.display = 'inline';
    $('who').innerText = '收货员：' + (me.name || '') + (me.warehouse_code ? '（' + me.warehouse_code + '）' : '');
    if (timer) clearInterval(timer);
    load();
    timer = setInterval(load, 5000);
  }

  async function rpcOne(fn, args) {
    const { data, error } = await sb.rpc(fn, args);
    if (error) throw error;
    return Array.isArray(data) ? data[0] : data;
  }

  async function boot() {
    if (token) {
      try {
        const r = await rpcOne('receiver_me', { p_token: token });
        if (r && r.ok) { me = r; showWorkbench(); return; }
      } catch (e) { /* 网络或 token 失效 */ }
      token = '';
      localStorage.removeItem(TOKEN_KEY);
    }
    showLogin();
  }

  $('lg-btn').onclick = async () => {
    const name = $('lg-name').value.trim();
    const phone = $('lg-phone').value.trim();
    const m = $('lg-msg');
    m.innerText = '';
    if (!name || !phone) { m.innerText = '请填写姓名和手机号'; return; }
    $('lg-btn').disabled = true;
    $('lg-btn').innerText = '登录中...';
    try {
      const r = await rpcOne('receiver_login', { p_name: name, p_phone: phone });
      if (!r || !r.ok) {
        m.innerText = (r && r.message) || '登录失败';
        return;
      }
      token = r.session_token;
      localStorage.setItem(TOKEN_KEY, token);
      me = { name: r.name, warehouse_code: r.warehouse_code };
      showWorkbench();
    } catch (e) {
      m.innerText = '登录失败：' + (e.message || e);
    } finally {
      $('lg-btn').disabled = false;
      $('lg-btn').innerText = '登录';
    }
  };

  $('logout').onclick = () => {
    token = '';
    localStorage.removeItem(TOKEN_KEY);
    location.reload();
  };

  $('btn-merge').onclick = () => openMerge();

  function minutesSince(t) {
    if (!t) return 0;
    return Math.max(0, Math.floor((Date.now() - new Date(t).getTime()) / 60000));
  }

  async function load() {
    try {
      const { data, error } = await sb.rpc('receiver_queue', { p_token: token });
      if (error) throw error;
      rows = data || [];
      $('msg').innerText = '';
      render();
      $('updated').innerText = '更新于 ' + new Date().toLocaleTimeString();
    } catch (e) {
      if (String(e.message || '').indexOf('登录') >= 0) {
        token = '';
        localStorage.removeItem(TOKEN_KEY);
        showLogin();
        $('lg-msg').innerText = '登录已失效，请重新登录';
        return;
      }
      $('msg').innerText = '加载失败：' + (e.message || e);
    }
  }

  function render() {
    const calling = rows.filter(v => v.queue_status === 'calling');
    const waiting = rows.filter(v => v.queue_status !== 'calling')
      .sort((a, b) => new Date(a.check_in_time || 0) - new Date(b.check_in_time || 0));

    $('calling-count').innerText = calling.length;
    $('waiting-count').innerText = waiting.length;

    $('calling-list').innerHTML = calling.map(v => `
      <div class="card calling">
        <div class="top">
          <span class="dock">${esc(v.assigned_dock || '未分配码头')}</span>
          <span class="code">${esc(v.appointment_code)}</span>
        </div>
        <div class="meta">
          ${esc(v.vendor_name || '-')} · <b>${v.boxes}</b> 箱<br>
          ${esc(v.slot || '')}${v.call_time ? ' · 已卸货 ' + minutesSince(v.call_time) + ' 分钟' : ''}
        </div>
        <button class="btn green" data-done="${esc(v.appointment_code)}">完成收货</button>
      </div>`).join('') || '<div class="empty">暂无卸货车辆</div>';

    $('waiting-list').innerHTML = waiting.map((v, i) => `
      <div class="card">
        <div class="top">
          <span class="pos">第 ${i + 1} 位</span>
          <span class="code">${esc(v.appointment_code)}</span>
        </div>
        <div class="meta">
          ${esc(v.vendor_name || '-')} · <b>${v.boxes}</b> 箱 · ${esc(v.slot || '')}<br>
          已等 ${minutesSince(v.check_in_time)} 分钟
        </div>
        <button class="btn blue" data-call="${esc(v.appointment_code)}" data-wh="${esc(v.warehouse_code || '')}">叫车</button>
      </div>`).join('') || '<div class="empty">暂无等待车辆</div>';

    document.querySelectorAll('[data-done]').forEach(b => {
      b.onclick = () => finishVehicle(b.dataset.done);
    });
    document.querySelectorAll('[data-call]').forEach(b => {
      b.onclick = () => callVehicle(b.dataset.call, b.dataset.wh);
    });
  }

  async function callVehicle(code, wh) {
    const dock = await pickDock(wh);
    if (!dock) return;
    try {
      const r = await rpcOne('receiver_call', { p_token: token, p_code: code, p_dock: dock });
      if (!r || !r.ok) return alert((r && r.message) || '叫车失败');
      await load();
    } catch (e) {
      alert('叫车失败：' + (e.message || e));
    }
  }

  async function finishVehicle(code) {
    if (!confirm('确认该车已完成收货？')) return;
    try {
      const r = await rpcOne('receiver_finish', { p_token: token, p_code: code });
      if (!r || !r.ok) return alert((r && r.message) || '操作失败');
      await load();
      openNextCall();
    } catch (e) {
      alert('操作失败：' + (e.message || e));
    }
  }

  function sheet(html) {
    const mask = document.createElement('div');
    mask.className = 'mask';
    mask.innerHTML = `<div class="sheet">${html}</div>`;
    $('modal-root').appendChild(mask);
    mask.addEventListener('click', (e) => { if (e.target === mask) mask.remove(); });
    return mask;
  }

  async function pickDock(wh) {
    let docks = [];
    try {
      const { data, error } = await sb.rpc('receiver_docks', { p_token: token });
      if (!error) docks = (data || []).filter(d => !wh || d.warehouse_code === wh);
    } catch (e) {}

    const busy = new Set(rows.filter(v => v.queue_status === 'calling' && (!wh || v.warehouse_code === wh))
      .map(v => v.assigned_dock).filter(Boolean));

    return new Promise((resolve) => {
      const mask = sheet(`
        <h3>选择码头</h3>
        ${docks.map(d => {
          const used = busy.has(d.dock_name);
          return `<button class="opt ${used ? '' : 'primary'}" data-dock="${esc(d.dock_name)}" ${used ? 'disabled' : ''}>
            ${esc(d.dock_name)}${d.temp_layer ? ' · ' + esc(d.temp_layer) : ''}${used ? '（占用中）' : ''}
          </button>`;
        }).join('') || '<p style="color:#94a3b8;font-size:14px;">该仓库还没有配置码头，可手动输入</p>'}
        <input id="dk-custom" placeholder="或手动输入码头名称" />
        <button class="opt primary" id="dk-ok">确认输入</button>
        <button class="cancel" id="dk-cancel">取消</button>
      `);

      const done = (v) => { mask.remove(); resolve(v); };
      mask.querySelectorAll('[data-dock]').forEach(b => { b.onclick = () => done(b.dataset.dock); });
      mask.querySelector('#dk-cancel').onclick = () => done(null);
      mask.querySelector('#dk-ok').onclick = () => {
        const v = mask.querySelector('#dk-custom').value.trim();
        if (v) done(v);
      };
    });
  }

  function openNextCall() {
    const waiting = rows.filter(v => v.queue_status !== 'calling')
      .sort((a, b) => new Date(a.check_in_time || 0) - new Date(b.check_in_time || 0));

    const mask = sheet(`
      <h3>选择下一辆叫车</h3>
      ${waiting.map((v, i) => `<button class="opt primary" data-next="${esc(v.appointment_code)}" data-wh="${esc(v.warehouse_code || '')}">
        第 ${i + 1} 位 · ${esc(v.appointment_code)} · ${esc(v.vendor_name || '-')} · ${v.boxes} 箱
      </button>`).join('') || '<p style="color:#94a3b8;font-size:14px;">暂无等待车辆</p>'}
      <button class="cancel" id="next-cancel">关闭</button>
    `);

    mask.querySelector('#next-cancel').onclick = () => mask.remove();
    mask.querySelectorAll('[data-next]').forEach(b => {
      b.onclick = async () => {
        mask.remove();
        await callVehicle(b.dataset.next, b.dataset.wh);
      };
    });
  }

  async function openMerge() {
    const list = rows.filter(v => v.queue_status === 'waiting' || v.queue_status === 'calling');
    if (!list.length) return alert('当前没有可合并的车辆');

    let docks = [];
    try {
      const { data } = await sb.rpc('receiver_docks', { p_token: token });
      docks = data || [];
    } catch (e) {}

    const mask = sheet(`
      <h3>合并收货</h3>
      <label style="font-size:13px;color:#64748b;">选择码头</label>
      <select id="mg-dock">
        ${docks.map(d => `<option value="${esc(d.dock_name)}">${esc(d.dock_name)}${d.temp_layer ? ' · ' + esc(d.temp_layer) : ''}</option>`).join('')}
        <option value="__custom">手动输入码头…</option>
      </select>
      <input id="mg-custom" placeholder="手动输入码头名称" style="display:none;" />
      <div style="margin:10px 0 6px;font-size:13px;color:#64748b;">勾选要合并的预约码（可多选）</div>
      ${list.map(v => `<label class="opt">
        <input type="checkbox" class="mg-code" value="${esc(v.appointment_code)}" />
        <span>${esc(v.appointment_code)} · ${esc(v.vendor_name || '-')} · ${v.boxes} 箱 · ${v.queue_status === 'calling' ? '卸货中' : '等待中'}</span>
      </label>`).join('')}
      <button class="opt primary" id="mg-ok">确认合并收货</button>
      <button class="cancel" id="mg-cancel">取消</button>
    `);

    const sel = mask.querySelector('#mg-dock');
    const custom = mask.querySelector('#mg-custom');
    const syncCustom = () => { custom.style.display = sel.value === '__custom' ? 'block' : 'none'; };
    sel.onchange = syncCustom;
    syncCustom();

    mask.querySelector('#mg-cancel').onclick = () => mask.remove();

    mask.querySelector('#mg-ok').onclick = async () => {
      const dock = sel.value === '__custom' ? custom.value.trim() : sel.value;
      if (!dock) return alert('请选择或输入码头');
      const codes = Array.from(mask.querySelectorAll('.mg-code:checked')).map(x => x.value);
      if (!codes.length) return alert('请至少勾选一个预约码');

      const btn = mask.querySelector('#mg-ok');
      btn.disabled = true;
      btn.innerText = '提交中...';
      try {
        const r = await rpcOne('receiver_merge_finish', { p_token: token, p_codes: codes, p_dock: dock });
        if (!r || !r.ok) {
          alert((r && r.message) || '合并收货失败');
          btn.disabled = false;
          btn.innerText = '确认合并收货';
          return;
        }
        mask.remove();
        alert(r.message);
        await load();
      } catch (e) {
        alert('合并收货失败：' + (e.message || e));
        btn.disabled = false;
        btn.innerText = '确认合并收货';
      }
    };
  }

  boot();
})();
</script>
</body>
</html>

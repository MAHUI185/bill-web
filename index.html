<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>厂商留库预约系统</title>
<link rel="icon" type="image/png" href="./logo.png">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #333; }
  .container { max-width: 1400px; margin: 0 auto; padding: 16px; height: 100vh; display: flex; flex-direction: column; }
  #app { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .card { background: #fff; border-radius: 8px; padding: 16px 24px; border: 1px solid #ebeef5; margin-bottom: 16px; display: flex; flex-direction: column; }
  h1, h2 { margin-bottom: 16px; font-weight: 600; }
  h2 { font-size: 18px; }
  input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; outline: none; transition: .2s; background: #fff; }
  input:focus, select:focus { border-color: #1677ff; }
  button { background: #1677ff; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: .2s; white-space: nowrap; }
  button:hover { background: #0958d9; }
  button.secondary { background: #fff; color: #1677ff; border: 1px solid #1677ff; }
  button.danger { background: #ff4d4f; }
  button.small { padding: 4px 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #ebeef5; padding: 10px 8px; text-align: left; }
  th { background: #fafafa; font-weight: 600; white-space: nowrap; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row > *:not(button) { flex: 1; min-width: 120px; }
  .msg { padding: 10px; border-radius: 4px; margin-bottom: 12px; }
  .msg.ok { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
  .msg.err { background: #fff2f0; color: #cf1322; border: 1px solid #ffccc7; }
  .nav { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; border-bottom: 1px solid #ebeef5; padding-bottom: 12px; }
  .nav button { background: #fff; color: #333; border: 1px solid #dcdfe6; }
  .nav button.active { background: #1677ff; color: #fff; border-color: #1677ff; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid #ebeef5; padding-bottom: 12px; }
  .tabs button { background: #fff; color: #666; border: 1px solid #dcdfe6; }
  .tabs button.active { background: #1677ff; color: #fff; border-color: #1677ff; }
  .stat { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  .stat.ok { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
  .stat.no { background: #fff2f0; color: #cf1322; border: 1px solid #ffccc7; }
  .scroll { flex: 1; overflow-y: auto; }
</style>
</head>
<body>
<div class="container">
  <div id="app"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>

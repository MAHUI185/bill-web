<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store">
<title>排队进度</title>
<style>
  body { margin: 0; background: #0f172a; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; text-align: center; transition: background 0.3s; }
  .container { padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .card { background: rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
  .title { font-size: 16px; color: #94a3b8; margin-bottom: 10px; }
  .value { font-size: 32px; font-weight: bold; color: #38bdf8; }
  .status-box { font-size: 24px; font-weight: bold; margin-top: 20px; color: #fbbf24; }
  .btn-active { background: #1677ff; color: #fff; border: none; padding: 16px; border-radius: 8px; font-size: 18px; width: 100%; margin-top: 20px; }
  .footer { font-size: 12px; color: #64748b; margin-top: 16px; display: flex; justify-content: center; gap: 16px; }
  .footer a { color: #38bdf8; text-decoration: none; }

  /* 叫号闪烁强提醒特效 */
  @keyframes flashBg { 0% { background: #dc2626; } 50% { background: #7f1d1d; } 100% { background: #dc2626; } }
  .calling-mode { animation: flashBg 0.8s infinite; display: flex; flex-direction: column; justify-content: center; height: 100vh; padding: 20px; }
  .calling-text { font-size: 40px; font-weight: bold; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.5); line-height: 1.5; }
</style>
<!-- 本地打包，避免手机网络加载 CDN 失败导致页面卡住 -->
<script src="./supabase-js.js"></script>
</head>
<body>

<div class="container" id="main-content">
  <h1 style="font-size: 28px; margin-bottom: 30px;">🚚 仓库排队进度</h1>

  <div class="card">
    <div class="title">预约单号</div>
    <div class="value" id="disp-code">--</div>
  </div>

  <div class="card">
    <div class="title">厂商 / 本车货量</div>
    <div style="font-size: 18px; font-weight: bold;" id="disp-vendor">--</div>
    <div style="font-size: 18px; margin-top: 5px;" id="disp-boxes">-- 箱（本车合计）</div>
  </div>

  <div class="card">
    <div class="title">前方排队车辆</div>
    <div class="value" id="disp-ahead" style="color: #f87171;">-- 辆</div>
  </div>

  <div class="status-box" id="disp-status">正在获取状态...</div>

  <div class="footer">
    <span id="disp-updated">--</span>
    <a href="javascript:location.reload()">刷新页面</a>
  </div>
</div>

<!-- 全屏叫号弹窗 -->
<div class="calling-mode" id="calling-screen" style="display: none;">
  <div style="font-size: 60px; margin-bottom: 20px;">📢</div>
  <div class="calling-text">请前往</div>
  <div class="calling-text" id="disp-dock" style="color: #fde047; font-size: 56px; margin: 20px 0;">--</div>
  <div class="calling-text" style="font-size: 32px;">卸货！</div>
</div>

<script>
(function () {
  const statusEl = () => document.getElementById('disp-status');

  if (!window.supabase || !window.supabase.createClient) {
    statusEl().innerText = '❌ 排队组件加载失败，请检查网络后刷新页面';
    statusEl().style.color = '#f87171';
    return;
  }

  const SUPABASE_URL = 'https://gpjdzgakvqhnpykuqbfr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_vUAhYoF1D51WyWlPnLzSlA_JDBODtaW';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const code = (urlParams.get('code') || '').trim();
  let isVoiceEnabled = false;
  let isCalling = false;
  let isDone = false;
  let timer = null;

  if (!code) {
    statusEl().innerText = '❌ 缺少预约码参数';
    return;
  }

  document.getElementById('disp-code').innerText = code;

  // 微信/iOS 必须用户手势解锁音频
  const btn = document.createElement('button');
  btn.className = 'btn-active';
  btn.innerText = '🔊 点击开启语音播报';
  btn.onclick = () => {
    isVoiceEnabled = true;
    btn.remove();
    speak('语音已激活，正在为您排队');
  };
  document.getElementById('main-content').appendChild(btn);

  function speak(text) {
    if (!('speechSynthesis' in window) || !isVoiceEnabled) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }

  function markUpdated() {
    const el = document.getElementById('disp-updated');
    if (el) el.innerText = '更新于 ' + new Date().toLocaleTimeString();
  }

  function getLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('当前浏览器不支持定位'));
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
        (err) => reject(new Error('定位失败：' + (err.message || '请允许定位权限'))),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  }

  function ensureCheckinButton() {
    if (document.getElementById('btn-self-checkin')) return;
    const b = document.createElement('button');
    b.id = 'btn-self-checkin';
    b.className = 'btn-active';
    b.style.background = '#16a34a';
    b.innerText = '✅ 我已到仓，签到';
    b.onclick = async () => {
      b.disabled = true;
      b.innerText = '定位中...';
      let pos;
      try {
        pos = await getLocation();
      } catch (e) {
        alert(e.message || '定位失败，请开启手机定位后重试');
        b.disabled = false;
        b.innerText = '✅ 我已到仓，签到';
        return;
      }
      b.innerText = '签到中...';
      try {
        const { data, error } = await supabase.rpc('driver_check_in', { p_code: code, p_lat: pos.lat, p_lng: pos.lng });
        if (error) throw error;
        const r = Array.isArray(data) ? data[0] : data;
        if (!r || !r.ok) {
          alert((r && r.message) || '签到失败');
          b.disabled = false;
          b.innerText = '✅ 我已到仓，签到';
          return;
        }
        alert(r.message);
        b.remove();
        checkStatus();
      } catch (e) {
        alert('签到失败：' + (e.message || e));
        b.disabled = false;
        b.innerText = '✅ 我已到仓，签到';
      }
    };
    document.getElementById('main-content').appendChild(b);
  }

  function removeCheckinButton() {
    const b = document.getElementById('btn-self-checkin');
    if (b) b.remove();
  }

  async function checkStatus() {
    if (isDone) return;
    let res;
    try {
      res = await supabase.rpc('get_queue_status', { p_code: code });
    } catch (e) {
      statusEl().innerText = '⚠️ 网络异常，正在重试...';
      return;
    }

    const { data, error } = res;
    if (error) {
      statusEl().innerText = '⚠️ 连接失败：' + (error.message || '未知错误');
      statusEl().style.color = '#f87171';
      return;
    }
    if (!data || data.length === 0) {
      statusEl().innerText = '❌ 预约码不存在或已失效';
      statusEl().style.color = '#f87171';
      return;
    }

    const info = data[0];
    document.getElementById('disp-vendor').innerText = info.vendor_name || '--';
    document.getElementById('disp-boxes').innerText = `${info.total_boxes || 0} 箱（本车合计）`;
    statusEl().style.color = '#fbbf24';
    markUpdated();

    if (info.queue_status === 'pending') {
      ensureCheckinButton();
      statusEl().innerText = '⏳ 待签到';
      document.getElementById('disp-ahead').innerText = '-- 辆';
    } else if (info.queue_status === 'waiting') {
      removeCheckinButton();
      const ahead = Number(info.cars_ahead || 0);
      statusEl().innerText = '🚚 已签到，排队中';
      document.getElementById('disp-ahead').innerText = ahead > 0 ? `${ahead} 辆` : '即将轮到您';
    } else if (info.queue_status === 'calling') {
      removeCheckinButton();
      document.getElementById('disp-dock').innerText = info.assigned_dock || '--';
      if (!isCalling) {
        isCalling = true;
        document.getElementById('main-content').style.display = 'none';
        document.getElementById('calling-screen').style.display = 'flex';
        if (navigator.vibrate) navigator.vibrate([1000, 500, 1000, 500, 1000]);
        speak(`请前往${info.assigned_dock || ''}卸货`);
      }
    } else if (info.queue_status === 'done') {
      removeCheckinButton();
      isDone = true;
      isCalling = false;
      if (timer) clearInterval(timer);
      document.getElementById('calling-screen').style.display = 'none';
      document.getElementById('main-content').style.display = 'flex';
      statusEl().innerText = '✅ 已完成卸货，请离场';
      statusEl().style.color = '#4ade80';
      document.getElementById('disp-ahead').innerText = '-- 辆';
      speak('卸货已完成，请离场');
    }
  }

  checkStatus();
  timer = setInterval(checkStatus, 5000);
})();
</script>
</body>
</html>
